name: 대회 정보 자동 수집

on:
  schedule:
    - cron: "17 21 * * 0"   # 매주 월요일 오전 6시 17분 (한국 시간)
    - cron: "17 21 * * 3"   # 매주 목요일 오전 6시 17분 (한국 시간)
  workflow_dispatch:         # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 이미지 처리 도구 설치
        run: pip install pillow

      - name: 저장용 계정 설정
        run: |
          git config user.name "runnerspot-bot"
          git config user.email "runnerspot-bot@users.noreply.github.com"

      - name: 대회 수집 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          ENRICH_LIMIT: "250"
        run: python scripts/collect.py

      - name: 바뀐 내용 저장
        run: |
          git add data posters
          if git diff --cached --quiet; then
            echo "바뀐 대회 정보 없음"
          else
            git commit -m "대회 정보 자동 업데이트 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git pull -q --rebase -X theirs origin main
            git push
          fi
